<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #f4f6f8; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #0ea5e9; color: #ffffff; padding: 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 32px 24px; text-align: center; }
        .btn { display: inline-block; background: #0ea5e9; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 6px; font-weight: 600; margin: 24px 0; }
        .btn:hover { background: #0284c7; }
        .footer { padding: 24px; text-align: center; color: #64748b; font-size: 14px; border-top: 1px solid #e2e8f0; }
        .warning { color: #ef4444; font-size: 14px; margin-top: 16px; }
        .url { background: #f1f5f9; padding: 12px 16px; border-radius: 6px; word-break: break-all; font-size: 14px; color: #0ea5e9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ site_name }}</h1>
        </div>
        <div class="content">
            <h2>Reset Your Password</h2>
            <p>We received a request to reset the password for {{ identifier }}.</p>
            <a href="{{ reset_url }}" class="btn">Reset Password</a>
            <p>Or copy this link into your browser:</p>
            <div class="url">{{ reset_url }}</div>
            <p class="warning">This link expires in 1 hour. If you didn't request this, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; {{ site_name }} Admin Panel</p>
        </div>
    </div>
</body>
</html>
