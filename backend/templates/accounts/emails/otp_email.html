<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Verification Code</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #f4f6f8; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #0ea5e9; color: #ffffff; padding: 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 32px 24px; text-align: center; }
        .code { display: inline-block; background: #f1f5f9; border: 2px dashed #0ea5e9; border-radius: 8px; font-size: 32px; font-weight: bold; letter-spacing: 8px; padding: 20px 32px; margin: 24px 0; color: #0ea5e9; }
        .footer { padding: 24px; text-align: center; color: #64748b; font-size: 14px; border-top: 1px solid #e2e8f0; }
        .warning { color: #ef4444; font-size: 14px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ site_name }}</h1>
        </div>
        <div class="content">
            <h2>Your {{ purpose }} Code</h2>
            <p>Use the code below to verify your {{ identifier }}:</p>
            <div class="code">{{ code }}</div>
            <p>This code expires in 10 minutes.</p>
            <p class="warning">If you didn't request this code, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; {{ site_name }} Admin Panel</p>
        </div>
    </div>
</body>
</html>
