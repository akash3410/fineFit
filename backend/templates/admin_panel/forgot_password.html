{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FineFit Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-card card shadow">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h3 class="card-title">FineFit Admin</h3>
                <p class="text-muted">Forgot your password?</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email or Phone Number</label>
                    <input type="text" name="identifier" class="form-control" placeholder="you@finefit.com or +1234567890" required autofocus value="{{ identifier|default:'' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Send reset via</label>
                    <select name="channel" class="form-select">
                        <option value="email" {% if channel == 'sms' %}{% else %}selected{% endif %}>Email</option>
                        <option value="sms" {% if channel == 'sms' %}selected{% endif %}>SMS</option>
                    </select>
                    <div class="form-text">A reset link or code will be sent to your email or phone.</div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Send Reset Link</button>
                </div>
                <input type="hidden" name="channel" value="{{ channel|default:'email' }}">
            </form>

            <div class="text-center mt-4">
                <a href="/admin/login/" class="btn btn-outline-secondary">Back to Login</a>
            </div>
            <div class="text-center mt-2">
                <p class="small text-muted">&copy; 2026 FineFit Admin Panel</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
