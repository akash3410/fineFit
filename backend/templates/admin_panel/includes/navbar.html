<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container-fluid">
        <button class="btn btn-outline-secondary d-md-none" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <span class="navbar-brand mb-0 h1 ms-2">{% block page_title %}Admin Panel{% endblock %}</span>
        <div class="ms-auto">
            {% if request.user.is_authenticated %}
            <div class="dropdown">
                <button class="btn btn-link dropdown-toggle text-dark text-decoration-none" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-1"></i> {{ request.user.email|default:request.user.username }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><h6 class="dropdown-header">Account Security</h6></li>
                    <li><a class="dropdown-item" href="{% url 'admin_panel:forgot_password' %}"><i class="bi bi-key me-2"></i>Forgot Password</a></li>
                    <li>
                        {% if request.user.account_verified %}
                        <span class="dropdown-item text-success"><i class="bi bi-check-circle me-2"></i>Verified</span>
                        {% else %}
                        <a class="dropdown-item" href="{% url 'admin_panel:verify_account' %}"><i class="bi bi-envelope me-2"></i>Verify Account</a>
                        {% endif %}
                    </li>
                    <li><a class="dropdown-item" href="{% url 'admin_panel:2fa_settings' %}"><i class="bi bi-shield-lock me-2"></i>Two-Factor Auth</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="/admin/logout/"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                </ul>
            </div>
            {% else %}
            <a href="/admin/login/" class="btn btn-outline-primary">Login</a>
            {% endif %}
        </div>
    </div>
</nav>
