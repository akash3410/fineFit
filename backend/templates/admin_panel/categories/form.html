{% extends 'admin_panel/base.html' %}
{% block title %}{{ action }} Category - FineFit Admin{% endblock %}
{% block page_title %}{{ action }} Category{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-white">
        <h5 class="mb-0">{{ action }} Category</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ category.name|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Slug</label>
                <input type="text" name="slug" class="form-control" value="{{ category.slug|default:'' }}" placeholder="Auto-generated if empty">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ category.description|default:'' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="active" {% if category.is_active or not category %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if category and not category.is_active %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/admin/categories/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
