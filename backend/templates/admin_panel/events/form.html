{% extends 'admin_panel/base.html' %}
{% block title %}{{ action }} Event - FineFit Admin{% endblock %}
{% block page_title %}{{ action }} Event{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-white">
        <h5 class="mb-0">{{ action }} Event</h5>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Title <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" value="{{ event.title|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Slug</label>
                <input type="text" name="slug" class="form-control" value="{{ event.slug|default:'' }}" placeholder="Auto-generated if empty">
            </div>
            <div class="mb-3">
                <label class="form-label">Announcement</label>
                <textarea name="announcement" class="form-control" rows="3">{{ event.announcement|default:'' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Image</label>
                {% if event.image %}
                <div class="mb-2">
                    <img src="{{ event.image.url }}" alt="{{ event.title }}" style="max-height: 150px;" class="img-thumbnail">
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="clear_image" id="clear_image">
                    <label class="form-check-label" for="clear_image">Remove current image</label>
                </div>
                {% endif %}
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">Starts At <span class="text-danger">*</span></label>
                <input type="datetime-local" name="start_at" class="form-control" value="{% if event %}{{ event.start_at|date:'Y-m-d\TH:i' }}{% endif %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Ends At <span class="text-danger">*</span></label>
                <input type="datetime-local" name="end_at" class="form-control" value="{% if event %}{{ event.end_at|date:'Y-m-d\TH:i' }}{% endif %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">CTA Label</label>
                <input type="text" name="cta_label" class="form-control" value="{{ event.cta_label|default:'Explore Event' }}" placeholder="Explore Event">
            </div>
            <div class="mb-3">
                <label class="form-label">CTA Link</label>
                <input type="url" name="cta_link" class="form-control" value="{{ event.cta_link|default:'' }}" placeholder="https://example.com or /shop/">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if event.is_active or not event %}checked{% endif %}>
                <label class="form-check-label" for="is_active">Active (visible on storefront)</label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/admin/events/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
