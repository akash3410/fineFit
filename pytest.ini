[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_tests.py
# Import roots resolved relative to rootdir (the repository root):
#   backend/       -> config.settings.*, manage.py
#   backend/apps/  -> apps.<app_name>.*
# backend/conftest.py enforces the same paths at runtime so imports work
# regardless of the working directory or the test runner used (terminal, IDE).
pythonpath = backend backend/apps
testpaths = backend/apps backend/config
addopts = -v --strict-markers
